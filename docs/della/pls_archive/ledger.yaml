  the shared final RMSNorm + lm_head and trained on NTP, weight 1 at every layer, always on (user 2026-09-29: dense,
  every-layer, always-on version of LLAL). First look: 130m and 300m, pls1 only (user 2026-09-29: no pls0, the
  baselines already exist). Per-layer eval eval/L{k}/..., per-layer train loss train/pls/L{k}.
